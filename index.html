<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smeckhokot.mp4 — контроль скорости</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #container {
            background: #141a24;
            border-radius: 28px;
            padding: 20px;
            max-width: 960px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 0 0 1px #3d4a5a;
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
            background: #000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            cursor: default;
            pointer-events: none;
        }
        video::-webkit-media-controls { display: none !important; }
        video::-webkit-media-controls-enclosure { display: none !important; }
        video::-webkit-media-controls-panel { display: none !important; }
        video::-webkit-media-controls-overlay-play-button { display: none !important; }
        video::-webkit-media-controls-start-playback-button { display: none !important; }
        video::-webkit-media-controls-timeline { display: none !important; }
        video::-webkit-media-controls-current-time-display { display: none !important; }
        video::-webkit-media-controls-time-remaining-display { display: none !important; }
        video::-webkit-media-controls-mute-button { display: none !important; }
        video::-webkit-media-controls-volume-slider { display: none !important; }
        video::-webkit-media-controls-fullscreen-button { display: none !important; }
        video::-moz-media-controls { display: none !important; }
        video::-moz-media-controls-panel { display: none !important; }
        video::-ms-media-controls { display: none !important; }
        video::-ms-media-controls-panel { display: none !important; }

        #speed-control {
            position: absolute;
            bottom: 36px;
            right: 36px;
            background: rgba(10, 14, 22, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 12px 18px 14px 18px;
            border-radius: 60px;
            border: 1px solid #3d4a5a;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            gap: 14px;
            user-select: none;
            z-index: 10;
            transition: opacity 0.2s;
        }
        #speed-control label {
            color: #8899aa;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.6;
        }
        #speed-control input[type="range"] {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #2b3f52;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        #speed-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6a9ec4;
            border: 2px solid #b7cdd9;
            box-shadow: 0 0 12px #3f8fbf;
            cursor: pointer;
            transition: 0.1s;
        }
        #speed-control input[type="range"]::-webkit-slider-thumb:hover {
            background: #8ab8df;
            transform: scale(1.1);
        }
        #speed-control input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6a9ec4;
            border: 2px solid #b7cdd9;
            cursor: pointer;
        }
        #speed-value {
            color: #efd9b0;
            font-size: 18px;
            font-weight: 700;
            min-width: 48px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        #log {
            display: none;
        }

        @media (max-width: 700px) {
            #speed-control {
                bottom: 20px;
                right: 20px;
                padding: 10px 14px 12px 14px;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                border-radius: 40px;
                max-width: 260px;
            }
            #speed-control input[type="range"] {
                width: 80px;
            }
            #speed-value {
                font-size: 16px;
                min-width: 40px;
            }
        }
        @media (max-width: 480px) {
            #speed-control {
                bottom: 14px;
                right: 14px;
                padding: 8px 12px 10px 12px;
                gap: 6px;
            }
            #speed-control input[type="range"] {
                width: 60px;
            }
            #speed-control label {
                font-size: 11px;
            }
            #speed-value {
                font-size: 14px;
                min-width: 34px;
            }
        }
    </style>
</head>
<body>
<div id="container">
    <video id="player" preload="auto" playsinline disablePictureInPicture controlslist="nodownload nofullscreen noremoteplayback">
        <source src="smeckhokot.mp4" type="video/mp4">
        <p>File smeckhokot.mp4 not found.</p>
    </video>

    <div id="speed-control">
        <label>slow</label>
        <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.05" value="1.0">
        <label>fast</label>
        <span id="speed-value">1.00x</span>
    </div>

    <div id="log"></div>
</div>

<script>
    (function() {
        const video = document.getElementById('player');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speed-value');

        function setSpeed(value) {
            const speed = parseFloat(value);
            video.playbackRate = speed;
            speedValue.textContent = speed.toFixed(2) + 'x';
        }

        speedSlider.addEventListener('input', function() {
            setSpeed(this.value);
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === '[' || e.key === '{') {
                e.preventDefault();
                let newVal = parseFloat(speedSlider.value) - 0.05;
                if (newVal < 0.5) newVal = 0.5;
                speedSlider.value = newVal;
                setSpeed(newVal);
            } else if (e.key === ']' || e.key === '}') {
                e.preventDefault();
                let newVal = parseFloat(speedSlider.value) + 0.05;
                if (newVal > 2.0) newVal = 2.0;
                speedSlider.value = newVal;
                setSpeed(newVal);
            }
        });

        function forcePlay() {
            video.volume = 1.0;
            video.muted = false;
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    const unlock = function() {
                        video.play().catch(() => {});
                        document.removeEventListener('click', unlock);
                        document.removeEventListener('touchstart', unlock);
                        document.removeEventListener('keydown', unlock);
                    };
                    document.addEventListener('click', unlock);
                    document.addEventListener('touchstart', unlock);
                    document.addEventListener('keydown', unlock);
                });
            }
        }

        function preventPause() {
            video.addEventListener('pause', function() {
                if (!video.ended) {
                    video.play().catch(() => {});
                }
            });

            document.addEventListener('keydown', function(e) {
                const key = e.key;
                if (key === ' ' || key === 'Space' || key === 'k' || key === 'K' ||
                    key === 'ArrowUp' || key === 'ArrowDown' ||
                    key === 'MediaPlayPause' || key === 'MediaStop') {
                    e.preventDefault();
                    e.stopPropagation();
                    if (video.paused && !video.ended) {
                        video.play().catch(() => {});
                    }
                }
            }, true);

            video.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
            video.addEventListener('dragstart', function(e) {
                e.preventDefault();
            });
        }

        video.addEventListener('ended', function() {
            setTimeout(() => {
                video.currentTime = 0;
                video.play().catch(() => {});
            }, 1500);
        });

        window.addEventListener('load', function() {
            if (video.readyState >= 2) {
                forcePlay();
            } else {
                video.addEventListener('loadedmetadata', function onMeta() {
                    forcePlay();
                    video.removeEventListener('loadedmetadata', onMeta);
                });
            }
            preventPause();
            setSpeed(speedSlider.value);
        });

        setInterval(() => {
            if (video.paused && !video.ended && video.readyState > 0) {
                video.play().catch(() => {});
            }
        }, 4000);
    })();
</script>
</body>
</html>
